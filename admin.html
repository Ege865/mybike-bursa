<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Yönetim Paneli | My Bike Bursa</title>
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="assets/img/favicon-64.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=202611201729">
  <style>
    body { background: var(--bg); }
    .a-top { background: var(--dark); color: var(--on-dark); }
    .a-top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; }
    .a-top .logo img { height: 52px; }
    .a-top .who { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--on-dark-muted); }
    .a-main { padding-block: 32px 80px; }
    .a-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-l); padding: clamp(20px, 3vw, 32px); }
    .a-login { max-width: 420px; margin: 8vh auto 0; display: grid; gap: 16px; }
    .a-login h1 { font-size: 28px; }
    .a-msg { font-size: 14.5px; min-height: 1.4em; }
    .a-msg.err { color: var(--danger); }
    .a-msg.ok { color: #2f6b1f; }
    .a-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .a-bar h1 { font-size: 30px; }
    .a-bar .tools { display: flex; gap: 10px; flex-wrap: wrap; }
    .a-bar input[type=search] { height: 44px; border-radius: var(--pill); border: 1px solid var(--line-strong); padding: 0 18px; min-width: 240px; background: var(--card); }
    .a-table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-size: 14.5px; }
    .a-table th, .a-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .a-table th { background: var(--surface); font-weight: 600; color: var(--muted); font-size: 13px; }
    .a-table tr:last-child td { border-bottom: 0; }
    .a-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #e3e3dc; display: block; }
    .a-row-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .a-small { min-height: 38px; padding: 0 14px; font-size: 14px; }
    .pill-off { display: inline-block; padding: 2px 10px; border-radius: 99px; background: #e6e5df; color: var(--muted); font-size: 12.5px; }
    .pill-on { display: inline-block; padding: 2px 10px; border-radius: 99px; background: #f3e6b8; color: var(--accent-deep); font-size: 12.5px; }
    dialog.a-dlg { border: 0; border-radius: var(--radius-l); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-shadow: var(--shadow-2); }
    dialog.a-dlg::backdrop { background: rgba(20,19,17,.5); }
    .a-dlg form { display: grid; gap: 18px; padding: clamp(20px, 3vw, 32px); }
    .a-dlg .head { display: flex; justify-content: space-between; align-items: center; }
    .a-dlg h2 { font-size: 24px; }
    .a-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .a-grid .full { grid-column: 1 / -1; }
    .a-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 500; }
    .a-check input { width: 20px; height: 20px; accent-color: var(--ink); }
    .a-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .a-img { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .a-img img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .a-img .bar { display: flex; justify-content: space-between; gap: 4px; padding: 6px; }
    .a-img .bar button { font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; min-height: 28px; }
    .a-img.cover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .a-specs { display: grid; gap: 8px; }
    .a-spec { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; }
    .a-spec input { height: 42px; border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 10px; }
    .a-foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 720px) {
      .a-grid { grid-template-columns: 1fr; }
      .a-table .hide-s { display: none; }
      .a-bar input[type=search] { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body data-page="admin">
  <header class="a-top on-dark"><div class="wrap">
    <a class="logo" href="index.html" aria-label="Siteye dön"><img src="assets/img/logo.jpg" alt="My Bike" width="48" height="52"><span class="logo-text"><span>Yönetim</span><span>Ürünler</span></span></a>
    <div class="who" id="who"></div>
  </div></header>

  <main class="a-main"><div class="wrap" id="app"></div></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js?v=202611201729"></script>
  <script src="assets/js/data.js?v=202611201729"></script>
  <script src="assets/js/store.js?v=202611201729"></script>
  <script src="assets/js/app.js?v=202611201729"></script>
  <script src="assets/js/admin.js?v=202611201729"></script>
</body>
</html>
